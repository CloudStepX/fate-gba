plugins { id 'com.android.application' }
android {
    namespace 'com.fate.gba'
    compileSdk 34
    defaultConfig {
        applicationId 'com.fate.gba'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        fate {
            storeFile file('fate.keystore')
            storePassword 'fatefate'
            keyAlias 'fate'
            keyPassword 'fatefate'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fate }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
