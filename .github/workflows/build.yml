name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FATE-GBA-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FATE-GBA.apk
          gh release create "build-${{ github.run_number }}" FATE-GBA.apk --title "Build ${{ github.run_number }}" --notes "Automatic build"
